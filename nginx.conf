worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout combined;

  # unprivileged nginx cannot write the default /var/cache/nginx paths
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   512;
  gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

  server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # The assets are NOT content-hashed — this app ships as plain ES modules with
    # stable filenames. A long immutable cache here is exactly the bug that bit
    # apps.stump.wtf, where a year-long cache pinned a stale stylesheet. Keep it
    # short and revalidating; the files are tiny and gzip well.
    location / {
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
      try_files $uri $uri/ =404;
    }

    # ES modules must be served as JavaScript or the browser refuses them
    location ~* \.m?js$ {
      types { }
      default_type application/javascript;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The app makes no calls of its own except for fonts and device icons.
    # img-src covers rendering an icon; connect-src covers fetching it to inline
    # into an SVG/PNG export. Keep this in step with ICON_HOSTS in js/icons.js.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.jsdelivr.net https://cdn.simpleicons.org; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://cdn.simpleicons.org; base-uri 'none'; frame-ancestors 'none'" always;
  }
}
