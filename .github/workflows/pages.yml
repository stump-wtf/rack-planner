# Builds the Docusaurus docs (docs-site/) and publishes to GitHub Pages.
# Live at: https://stump-wtf.github.io/rack-planner/
#
# Gitea Actions only reads .gitea/workflows when that directory exists, so this
# file runs on GitHub ONLY. Gitea has no equivalent of actions/deploy-pages —
# the Gitea half syncs to Garage instead, see .gitea/workflows/pages.yaml.
name: Deploy Docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build
        working-directory: docs-site
        run: npm run build
        env:
          SITE_URL: https://stump-wtf.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
