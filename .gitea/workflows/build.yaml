# Build, scan and publish the container image, then converge the deployment.
#
# Push target is the StumpCloud registry: gitea.stump.rocks/stump.wtf/rack-planner
#
# The Gitea package MUST stay public. DUB hosts pull anonymously — there is no
# host-side registry auth anywhere in stumpcloud/ansible, and inventing some for
# one static site would be the wrong trade.
#
# conf.actions.repos in dub.yaml hardcodes owner: stumpcloud, so it cannot
# provision this repo's REGISTRY_TOKEN — like cairn and switchboard, a stump.wtf
# repo sets that secret by hand. Every registry step is guarded on it so the
# workflow skips green until it exists rather than failing red on every push.
# (REGISTRY_TOKEN is in fact inherited from the stump.wtf org, so the guard is
# belt-and-braces rather than the thing keeping the lane inert.)
#
# On merge to main the deploy job converges pie02 by dispatching
# stumpcloud/ansible's CI. See that job for why it does not SSH to the host.

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    name: build + publish image
    runs-on: ubuntu-latest
    env:
      REG: ${{ secrets.REGISTRY_TOKEN }}
      IMAGE: gitea.stump.rocks/stump.wtf/rack-planner
    steps:
      - name: Checkout
        if: ${{ env.REG != '' }}
        uses: actions/checkout@v4

      - name: Set metadata
        if: ${{ env.REG != '' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{ is_default_branch }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        if: ${{ env.REG != '' }}
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Set up Docker Buildx
        if: ${{ env.REG != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea
        if: ${{ env.REG != '' && gitea.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build image (amd64, for scanning)
        if: ${{ env.REG != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan-${{ gitea.run_id }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Trivy image scan
        if: ${{ env.REG != '' }}
        uses: docker://aquasec/trivy:latest
        with:
          args: image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --skip-version-check --format table ${{ env.IMAGE }}:scan-${{ gitea.run_id }}

      - name: Build and push (multi-arch)
        if: ${{ env.REG != '' && gitea.event_name != 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          # the fleet is a mix of amd64 boxes and arm SBCs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    name: deploy to pie02 (dispatch ansible)
    needs: [image]
    # The image job publishes :latest; this converges pie02 so the host actually
    # picks it up. Without it a merge here changes nothing in production until
    # something unrelated happens to converge the service.
    #
    # It dispatches stumpcloud/ansible's own CI rather than SSHing to the host
    # itself. That repo's dispatch lane already holds the OpenBao AppRole, the
    # SSH key and the Route53 credentials a service converge needs, and it is
    # already audited. The alternative — running ci-deploy-key.yaml and
    # ci-deploy-approle.yaml for pie02 and holding the results here — would put
    # a passwordless-sudo key for an OpenBao Raft voter in this repo's secrets,
    # and ansible-runner passes no --limit, so that key reaches the whole
    # inventory. Not worth it to redeploy a static site.
    #
    # Guarded on the token so an unprovisioned fork skips green rather than
    # failing red on every merge, the same way the image job guards on REG.
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DISPATCH: ${{ secrets.ANSIBLE_DISPATCH_TOKEN }}
      ANSIBLE_REPO: stumpcloud/ansible
      API: https://gitea.stump.rocks/api/v1
    steps:
      - name: Dispatch the rack-planner converge
        if: ${{ env.DISPATCH != '' }}
        run: |
          set -euo pipefail
          # Highest dispatch run id BEFORE we fire, so the poll below can tell
          # our run from one that was already there. Gitea's runs API returns no
          # created_at, so ids are the only ordering signal available.
          before=$(curl -sS "$API/repos/$ANSIBLE_REPO/actions/runs" \
            -H "Authorization: token $DISPATCH" \
            | jq '[.workflow_runs[] | select(.event == "workflow_dispatch") | .id] | max // 0')
          echo "before_id=$before" >> "$GITHUB_ENV"
          echo "latest dispatch run before ours: $before"

          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST "$API/repos/$ANSIBLE_REPO/actions/workflows/ci.yaml/dispatches" \
            -H "Authorization: token $DISPATCH" \
            -H 'Content-Type: application/json' \
            -d '{
                  "ref": "main",
                  "inputs": {
                    "playbook": "rack-planner",
                    "inventory": "dub.yaml",
                    "ssh_hosts": "pie02.stump.rocks"
                  }
                }')
          if [ "$code" != "204" ] && [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "dispatch failed with HTTP $code:"; cat /tmp/dispatch.out; exit 1
          fi
          echo "dispatched — https://gitea.stump.rocks/$ANSIBLE_REPO/actions"

      # A fire-and-forget dispatch reports success for a converge that failed,
      # which is worse than no deploy job at all: main goes green while the host
      # still runs the old image. Wait for the run this job started and adopt
      # its conclusion.
      - name: Wait for the converge to finish
        if: ${{ env.DISPATCH != '' }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            sleep 20
            run=$(curl -sS "$API/repos/$ANSIBLE_REPO/actions/runs" \
              -H "Authorization: token $DISPATCH" \
              | jq -c --argjson before "$before_id" '
                  [ .workflow_runs[]
                    | select(.event == "workflow_dispatch" and .id > $before) ]
                  | sort_by(.id) | last // empty
                ')
            [ -n "$run" ] || { echo "no run visible yet…"; continue; }

            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            url=$(echo "$run" | jq -r '.html_url // ""')
            echo "converge: status=$status conclusion=$conclusion $url"

            [ "$status" = "completed" ] || continue
            case "$conclusion" in
              success) echo "pie02 converged"; exit 0 ;;
              *) echo "converge finished $conclusion — see $url"; exit 1 ;;
            esac
          done
          echo "timed out waiting for the converge; check $API/repos/$ANSIBLE_REPO/actions"
          exit 1

      - name: Report that deploy is not provisioned
        if: ${{ env.DISPATCH == '' }}
        run: |
          echo "ANSIBLE_DISPATCH_TOKEN is not set — image published, host NOT converged."
          echo "Set it to a Gitea token with write access to $ANSIBLE_REPO actions."
